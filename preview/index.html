<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Royale Web Preview</title>
  <!-- CheerpJ WebAssembly Runtime -->
  <script src="https://cjrtnc.leaningtech.com/3.0/cj3exec.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0e0e10;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #controls {
      margin-bottom: 12px;
      font-size: 14px;
      color: #a1a1aa;
    }
    kbd {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      padding: 2px 6px;
      color: #fafafa;
    }
    #cheerpjDisplay {
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="controls">
    Controls: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to Move | <kbd>Left Click</kbd> Attack/Action | <kbd>E</kbd> Loot
  </div>

  <script>
    async function launchGame() {
      // Initialize the CheerpJ WebAssembly environment
      await cheerpjInit();
      // Mount and run the JAR file in the browser window
      cheerpjCreateDisplay(800, 600);
      await cheerpjRunJar("/app/game.jar");
    }
    launchGame();
  </script>
</body>
</html>
