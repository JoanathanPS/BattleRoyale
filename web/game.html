<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Royale Arena — WebGL Engine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
    <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #07090e;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        #embed-html {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            margin: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
    </style>
    <script src="battlearena/soundmanager2-jsmin.js"></script>
    <script src="battlearena/soundmanager2-setup.js"></script>
    <script src="battlearena/battlearena.nocache.js"></script>
</head>
<body id="embed-html">
    <script>
      window.addEventListener('click', () => {
        const c = document.querySelector('canvas');
        if (c) c.focus();
      });
    </script>
</body>
</html>
